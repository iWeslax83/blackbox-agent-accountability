services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teluvane_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teluvane_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - teluvane_test_db:/var/lib/postgresql/data

volumes:
  teluvane_test_db:
